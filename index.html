 wards and special zones that are not named in the lists for Regions 1, 2 and 3.', bhtnLegTip:'Quick check: look up the commune or ward where you work in the Appendix of Decree 293/2025/ND-CP. If it is not listed under Region 1, 2 or 3, it is Region 4. The examples above are illustrative only and do not replace the official list. This tool uses the regional minimum wages effective from 01/01/2026.', bhtnEmpty:'Fill in the details above and press "Calculate benefit" to see your result.', bhtnExH:'How unemployment benefit is calculated', bhtnExStep1:'1. Total unemployment insurance (UI) contribution period', bhtnExStep1Detail:'Recorded UI contribution period: {d} ({m} months), eligible under current regulations (at least 12 months contributed).', bhtnExStep2:'2. Average salary of the last 6 consecutive contribution months', bhtnExStep2Detail:'Benefit calculation is based on the average monthly UI contribution salary of the 6 months prior to contract termination:', bhtnAvgFormula:'Total salary for 6 months: {sum} VND → 6-month average: {sum} ÷ 6 = {avg}', bhtnExStep3:'3. Monthly unemployment benefit amount', bhtnExStep3Raw:'Formula amount = 60% × Average salary = 60% × {avg} = {raw}', bhtnExStep3Cap:'Regional ceiling ({reg}): 5 × Regional minimum wage ({wage}) = {cap}', bhtnExStep3CapApplied:'Since the 60% calculation ({raw}) exceeds the regional cap ({cap}), the benefit is limited to the cap: {monthly}/month.', bhtnExStep3Final:'Monthly unemployment benefit: {monthly}/month.', bhtnExStep4:'4. Number of benefit months', bhtnExStep4Detail:'12 to 36 months of contributions gives 3 months of benefit; each additional full 12 months adds 1 month (up to 12 months maximum).', bhtnExStep4Res:'Total contribution of {m} months → Entitled to {bm} of benefits.', bhtnExStep4Reserve:'Reserved remaining contribution months for future claims: {rm} months.', bhtnExStep5:'5. Total unemployment benefit payout', bhtnExStep5Detail:'Total = {monthly} × {bm} months = {total} ({words}).',
  "aiFab": "Ask AI", "aiTitle": "AI Assistant", "aiBadge": "Simulated", "aiSub": "Answers come from built-in rules, not a real AI", "aiPh": "Choose one of the preset questions below:", "aiSend": "Send", "aiClose": "Close", "aiClear": "New conversation", "aiTyping": "Writing a reply", "aiWelcome": "Hi! I am the simulated AI assistant of this tool. I can explain your result, the formula, price-adjustment coefficients, voluntary SI, maternity periods and more. Just ask.", "aiQ": ["Explain my result", "What is the payout formula?", "What are price-adjustment coefficients for?", "How are odd months counted?", "What if I contributed under 1 year?", "How is a maternity period counted?", "How does State support for voluntary SI work?", "Who is eligible for the one-time payout?", "What documents do I need to apply?", "Should I withdraw or keep contributing?"], "aiK": ["result", "formula", "coef", "odd", "u1", "mat", "vol", "elig", "proc", "should"], "aiA_hello": "Hi! What would you like to know about the one-time payout? 🌸", "aiA_help": "I am a simulated AI assistant: my answers come from the rules and data built into this tool. I am not a real AI and I do not replace advice from the social insurance agency. I can:\n• Explain your calculated result\n• Explain the formula, coefficients and odd months\n• Talk about voluntary SI, maternity periods, eligibility and the application process\nTry one of the suggestions below.", "aiA_thanks": "You are welcome! Ask me anything else anytime 🌸", "aiA_formula": "Formula for the one-time payout:\n• Each year contributed before 2014: 1.5 × the average monthly contribution salary.\n• Each year contributed from 2014: 2 × the average.\n• Under 1 year: you receive the amount you paid, capped at 2 × the average.\n• Average = sum of (monthly salary × price-adjustment coefficient of that year) ÷ total months.\n• For voluntary SI, the State support is deducted as well.", "aiA_coef": "The price-adjustment coefficient converts salaries from past years to today price levels. For example, a coefficient of 1.36 means a salary of 10,000,000 paid that year counts as 13,600,000. The further back the year, the higher the coefficient; from 2025 it is 1.00. See the full table in the “Price-adjustment coefficients” section at the bottom, or ask me “what is the coefficient for 2015?”.", "aiA_coefYear": "The price-adjustment coefficient for {y} is {c}. So a salary of 10,000,000 paid that year counts as {e} in the average.", "aiA_mat": "Maternity leave counts as contribution time. In this tool, the salary for a maternity period is estimated as the average of up to 6 adjacent compulsory contribution months. Add it with the “Add maternity period” button; you need at least one compulsory period.", "aiA_vol": "Voluntary SI: you pay 22% of the income you choose. The State supports part of it from 01/01/2018, for up to 120 months, and this support is not refunded, so it is deducted from the payout.\n• Through 06/2025: 30% poor households, 25% near-poor, 10% others.\n• From 07/2025: 50%, 40%, 20%.\nThe tool offers two ways to calculate the support (match the reference tool, or by period). You choose below the periods when a voluntary period exists.", "aiA_odd": "Odd months (the remainder after whole years): 1 to 6 months count as 0.5 year; 7 to 11 months count as 1 year. Odd months from before 2014 are moved into the period from 2014 (× 2).", "aiA_u1": "If the total contribution time is under 12 months, the payout equals the amount paid (22% of salary), but not more than 2 times the average monthly contribution salary.", "aiA_elig": "Eligibility for the one-time payout is decided by the social insurance agency under current rules. Typically it applies to people who left their job and did not resume contributions after 12 months, and who do not yet qualify for a pension; there are also special cases such as settling abroad or a serious illness. Please confirm with the agency before applying.", "aiA_proc": "The file usually includes a request for the one-time payout, your social insurance book or number, an ID document, and papers related to leaving your job. You can submit it at the social insurance office, by post or through online public services. The exact list may change, so ask the office where you are enrolled.", "aiA_should": "I cannot tell you whether to withdraw, but here are points to weigh:\n• Withdraw once: you get the money now, but the contribution time is no longer kept toward a pension and other long-term benefits.\n• Keep or resume contributing: you preserve the contribution time and move toward a monthly pension.\nIf you have many years of contributions, ask the social insurance agency or an expert before deciding.", "aiA_fallback": "I did not quite understand that. I am a simulated assistant, so I can only answer topics covered by this tool. Try one of the suggestions below.", "aiA_noRes": "There is not enough information yet for me to explain a result. Enter a salary for at least one period (or press “Fill in sample data”), then ask me again.", "aiResIntro": "Based on the data you entered, the result is calculated like this:", "aiYrsDetail": "before 2014: {pre} years × 1.5; from 2014: {post} years × 2", "aiResOutro": "Press “Show full calculation” in the result panel to see every step.",

  "aiFab": "AIに質問", "aiTitle": "AIアシスタント", "aiBadge": "シミュレーション", "aiSub": "内蔵ルールによる回答です（本物のAIではありません）", "aiPh": "下記の質問から選んでください：", "aiSend": "送信", "aiClose": "閉じる", "aiClear": "新しい会話", "aiTyping": "回答を作成中", "aiWelcome": "こんにちは！このツールのシミュレーションAIアシスタントです。結果の説明、計算式、物価スライド係数、任意加入、出産期間などについてお答えします。お気軽にどうぞ。", "aiQ": ["私の結果を説明して", "一時金の計算式は？", "物価スライド係数とは？", "端数月はどう計算する？", "1年未満の場合は？", "産休期間はどう計算する？", "任意加入の国の補助は？", "受給できる条件は？", "申請に必要な書類は？", "受け取るべき？続けるべき？"], "aiK": ["result", "formula", "coef", "odd", "u1", "mat", "vol", "elig", "proc", "should"], "aiA_hello": "こんにちは！一時金の計算について、何を知りたいですか？🌸", "aiA_help": "私はシミュレーションのAIアシスタントです。回答はこのツールに内蔵されたルールとデータに基づくもので、本物のAIではなく、社会保険機関の相談に代わるものでもありません。できること：\n• あなたの計算結果の説明\n• 計算式、物価スライド係数、端数月の説明\n• 任意加入、出産期間、受給条件や手続きについての案内\n下の候補から選んでみてください。", "aiA_thanks": "どういたしまして！またいつでも質問してください🌸", "aiA_formula": "一時金の計算式：\n• 2014年より前に納付した年：納付月額給与の平均の1.5倍。\n• 2014年以降に納付した年：平均の2倍。\n• 1年未満：納付済み額を受け取り、平均の2倍が上限。\n• 平均 = Σ（各月の給与 × その年の物価スライド係数）÷ 総月数。\n• 任意加入の場合は、国の補助額も差し引きます。", "aiA_coef": "物価スライド係数は、過去の年の給与を現在の物価水準に換算するためのものです。たとえば係数1.36なら、その年に納付した給与10,000,000は13,600,000として扱われます。古い年ほど係数は高く、2025年以降は1.00です。全体の表はページ下部の「物価スライド係数」で確認できます。「2015年の係数は？」と聞くこともできます。", "aiA_coefYear": "{y}年の物価スライド係数は{c}です。その年に納付した給与10,000,000は、平均計算では{e}として扱われます。", "aiA_mat": "産休期間は納付期間として扱われます。このツールでは、出産期間の給与は、直前の強制加入の最大6か月の平均で試算します。「出産期間を追加」ボタンで追加でき、強制加入の期間が1つ以上必要です。", "aiA_vol": "任意加入：選んだ所得の22%を納付します。国は2018年1月1日から最大120か月まで一部を補助し、この補助は返還されないため給付額から差し引きます。\n• 2025年6月まで：貧困世帯30%、準貧困世帯25%、その他10%。\n• 2025年7月から：50%、40%、20%。\nツールには補助額の計算方法が2つあります（参照ツールに合わせる／期間ごと）。任意加入の期間があると、期間一覧の下で選べます。", "aiA_odd": "端数月（年数を除いた余り）：1〜6か月は0.5年、7〜11か月は1年として計算します。2014年より前の端数月は、2014年以降の期間（2倍）に組み入れます。", "aiA_u1": "納付期間の合計が12か月未満の場合、給付額は納付済み額（給与の22%）となり、納付月額給与の平均の2倍が上限です。", "aiA_elig": "一時金の受給条件は、現行の規定に基づき社会保険機関が判断します。一般には、退職して12か月経っても保険料を納付しておらず、年金の受給条件を満たさない方が対象で、海外への定住や重い病気などの特例もあります。申請の前に社会保険機関でご確認ください。", "aiA_proc": "申請書類には、通常、一時金の申請書、社会保険手帳または番号、身分証明書、退職に関する書類が含まれます。社会保険事務所の窓口、郵送、オンライン行政サービスで提出できます。必要書類は変わることがあるため、加入している事務所にご確認ください。", "aiA_should": "受け取るべきかどうかはお答えできませんが、判断のポイントは次のとおりです：\n• 一時金を受け取る：すぐにお金を受け取れますが、納付期間は年金などの長期給付のために引き継がれなくなります。\n• 保留または納付を続ける：納付期間を保ち、毎月の年金の受給条件に近づけます。\n納付年数が長い場合は、決める前に社会保険機関や専門家にご相談ください。", "aiA_fallback": "ご質問がうまく理解できませんでした。私はシミュレーションのため、このツールが扱う内容のみお答えできます。下の候補から選んでみてください。", "aiA_noRes": "結果を説明するには情報が足りません。少なくとも1つの期間の給与を入力するか「サンプルデータを入力」を押してから、もう一度質問してください。", "aiResIntro": "入力されたデータに基づく計算結果は次のとおりです：", "aiYrsDetail": "2014年前：{pre}年 × 1.5、2014年以降：{post}年 × 2", "aiResOutro": "結果欄の「計算過程を見る」を押すと、各ステップを確認できます。",

Object.assign(I18N.vi,{tncnExT:'Diễn giải từng bước',tncnS1:'Thu nhập chịu thuế (lương gross) = {g} {c}.',tncnL1:'Là toàn bộ tiền lương, tiền công và các khoản có tính chất tiền lương trước khi trừ bất kỳ khoản nào.',tncnS2:'Bảo hiểm bắt buộc = {b} × (8% + 1,5% + 1%) = {i} {c}.',tncnL2:'BHXH 8% + BHYT 1,5% + BHTN 1% = 10,5% trên mức lương đóng bảo hiểm; khoản này được trừ trước khi tính thuế.',tncnS3:'Giảm trừ gia cảnh = 15,500,000 + {n} × 6,200,000 = {d} {c}.',tncnS3o:'Giảm trừ khác: {o} {c}.',tncnL3:'15,5 triệu đồng/tháng cho bản thân và 6,2 triệu đồng/tháng cho mỗi người phụ thuộc (Nghị quyết 110/2025/UBTVQH15).',tncnS4:'Thu nhập tính thuế = {g} − {i} − {d}{o} = {x} {c}.',tncnS4z:'Thu nhập không vượt quá các khoản giảm trừ nên không phải nộp thuế TNCN.',tncnL4:'Thu nhập tính thuế = Tổng thu nhập − Các khoản giảm trừ (Điều 46 Nghị định 253/2026/NĐ-CP).',tncnS5:'Áp dụng biểu thuế lũy tiến từng phần:',tncnL5:'Mỗi phần thu nhập tính thuế rơi vào bậc nào thì chịu thuế suất của bậc đó (Điều 9 Luật Thuế TNCN 2025).',tncnBL:'Bậc {n}: {b} × {r}% = {t} {c}',tncnSum:'Thuế TNCN phải nộp = {t} {c}',tncnNetF1:'Thực nhận = {g} − {i} − {t} = {n} {c}.',tncnL6:'Lương net = Lương gross − Bảo hiểm bắt buộc − Thuế TNCN.',tncnX:'Thuế TNCN = {g} × {r}% = {t} {c}.',tncnL7:'Khoản chi trả từ 5 triệu đồng/lần trở lên phải khấu trừ 10% trước khi trả thu nhập (khoản 2 Điều 50 Nghị định 253/2026/NĐ-CP).',tncnL8:'Thu nhập từ tiền lương, tiền công của cá nhân không cư trú chịu thuế suất 20% (Điều 21 Luật Thuế TNCN 2025).',tncnNetF2:'Thực nhận = {g} − {t} = {n} {c}.',tncnRefT:'Biểu thuế lũy tiến từng phần',tncnUnit:'triệu đồng',tncnYearC:'Thu nhập tính thuế/năm',tncnMonthC:'Thu nhập tính thuế/tháng',tncnUpTo:'Đến {a}',tncnFromTo:'Trên {a} đến {b}',tncnOver:'Trên {a}',tncnGlT:'Giải thích thuật ngữ',tncnGl:[['Lương Gross và Net khác nhau thế nào?','Gross là lương trước khi trừ bảo hiểm và thuế. Net là số tiền thực nhận sau khi đã trừ bảo hiểm bắt buộc và thuế TNCN.'],['Thuế lũy tiến từng phần hoạt động ra sao?','Phần thu nhập tính thuế được chia theo từng bậc, mỗi phần chịu thuế suất của bậc tương ứng, không phải toàn bộ thu nhập chịu một mức thuế suất duy nhất.'],['Giảm trừ gia cảnh là gì?','Khoản được trừ vào thu nhập trước khi tính thuế: 15,5 triệu đồng/tháng cho bản thân và 6,2 triệu đồng/tháng cho mỗi người phụ thuộc. Mỗi người phụ thuộc chỉ được tính giảm trừ một lần vào một người nộp thuế.'],['Cá nhân cư trú và không cư trú khác nhau thế nào?','Cá nhân cư trú nộp thuế theo biểu lũy tiến (có hợp đồng lao động từ 3 tháng) hoặc khấu trừ 10% (không hợp đồng/dưới 3 tháng); cá nhân không cư trú chịu thuế suất 20% trên tiền lương, tiền công. Việc xác định cư trú cần đối chiếu quy định hiện hành.']]});
Object.assign(I18N.en,{tncnExT:'Step-by-step explanation',tncnS1:'Taxable income (gross salary) = {g} {c}.',tncnL1:'All salary, wages and salary-like items before any deduction.',tncnS2:'Mandatory insurance = {b} × (8% + 1.5% + 1%) = {i} {c}.',tncnL2:'Social 8% + Health 1.5% + Unemployment 1% = 10.5% of the insurance salary, deducted before tax.',tncnS3:'Family deduction = 15,500,000 + {n} × 6,200,000 = {d} {c}.',tncnS3o:'Other deductions: {o} {c}.',tncnL3:'VND 15.5 million/month for the taxpayer and VND 6.2 million/month per dependent (Resolution 110/2025/UBTVQH15).',tncnS4:'Assessable income = {g} − {i} − {d}{o} = {x} {c}.',tncnS4z:'Income does not exceed the deductions, so no personal income tax is due.',tncnL4:'Assessable income = total income − deductions (Art. 46, Decree 253/2026/ND-CP).',tncnS5:'Apply the progressive scale:',tncnL5:'Each slice of assessable income is taxed at the rate of its bracket (Art. 9, PIT Law 2025).',tncnBL:'Bracket {n}: {b} × {r}% = {t} {c}',tncnSum:'Personal income tax = {t} {c}',tncnNetF1:'Take-home = {g} − {i} − {t} = {n} {c}.',tncnL6:'Net salary = gross salary − mandatory insurance − personal income tax.',tncnX:'Tax = {g} × {r}% = {t} {c}.',tncnL7:'Payments of VND 5 million or more per payment are subject to 10% withholding (Art. 50(2), Decree 253/2026/ND-CP).',tncnL8:'Salary income of non-residents is taxed at 20% (Art. 21, PIT Law 2025).',tncnNetF2:'Take-home = {g} − {t} = {n} {c}.',tncnRefT:'Progressive tax scale',tncnUnit:'million VND',tncnYearC:'Assessable income/year',tncnMonthC:'Assessable income/month',tncnUpTo:'Up to {a}',tncnFromTo:'Over {a} to {b}',tncnOver:'Over {a}',tncnGlT:'Glossary',tncnGl:[['What is the difference between gross and net?','Gross is salary before insurance and tax. Net is what you receive after mandatory insurance and personal income tax.'],['How does progressive tax work?','Assessable income is split into slices; each slice is taxed at its own bracket rate, not the whole income at a single rate.'],['What is the family deduction?','An amount subtracted from income before tax: VND 15.5 million/month for yourself and VND 6.2 million/month per dependent. Each dependent can be claimed only once, by one taxpayer.'],['Resident vs non-resident?','Residents pay by the progressive scale (contract of 3+ months) or 10% withholding (no contract/under 3 months); non-residents pay 20% on salary. Residency should be checked against current rules.']]});
Object.assign(I18N.ja,{tncnExT:'ステップごとの解説',tncnS1:'課税所得（総支給額）＝ {g} {c}。',tncnL1:'控除前の給与・賃金および給与に準ずる収入の全額です。',tncnS2:'法定保険料＝ {b} ×（8％＋1.5％＋1％）＝ {i} {c}。',tncnL2:'社会保険8％＋医療1.5％＋失業1％＝10.5％（保険料算定給与に対して）。課税前に控除されます。',tncnS3:'家族控除＝ 15,500,000 ＋ {n} × 6,200,000 ＝ {d} {c}。',tncnS3o:'その他控除：{o} {c}。',tncnL3:'本人は月1,550万ドン、扶養1人につき月620万ドン（決議110/2025/UBTVQH15）。',tncnS4:'課税対象額＝ {g} − {i} − {d}{o} ＝ {x} {c}。',tncnS4z:'所得が控除額を超えないため、個人所得税はかかりません。',tncnL4:'課税対象額＝総所得−各種控除（政令253/2026/ND-CP 第46条）。',tncnS5:'累進税率を適用：',tncnL5:'課税対象額の各部分は、該当する区分の税率で課税されます（個人所得税法2025 第9条）。',tncnBL:'第{n}区分：{b} × {r}％ ＝ {t} {c}',tncnSum:'個人所得税額＝ {t} {c}',tncnNetF1:'手取り＝ {g} − {i} − {t} ＝ {n} {c}。',tncnL6:'手取り＝総支給額−法定保険料−個人所得税。',tncnX:'税額＝ {g} × {r}％ ＝ {t} {c}。',tncnL7:'1回の支払が500万ドン以上の場合、10％を源泉徴収します（政令253/2026/ND-CP 第50条2項）。',tncnL8:'非居住者の給与所得には20％の税率が適用されます（個人所得税法2025 第21条）。',tncnNetF2:'手取り＝ {g} − {t} ＝ {n} {c}。',tncnRefT:'累進税率表',tncnUnit:'百万ドン',tncnYearC:'年間課税対象額',tncnMonthC:'月間課税対象額',tncnUpTo:'{a}以下',tncnFromTo:'{a}超〜{b}',tncnOver:'{a}超',tncnGlT:'用語解説',tncnGl:[['総支給額と手取りの違いは？','総支給額は保険料と税金を引く前の給与、手取りは法定保険料と個人所得税を引いた後の受取額です。'],['累進課税の仕組みは？','課税対象額を区分ごとに分け、各部分にその区分の税率を適用します。全体に1つの税率がかかるわけではありません。'],['家族控除とは？','課税前に所得から差し引く金額で、本人は月1,550万ドン、扶養1人につき月620万ドンです。扶養者は1人の納税者にのみ申告できます。'],['居住者と非居住者の違いは？','居住者は累進税率（3か月以上の契約）または10％源泉（契約なし／3か月未満）、非居住者は給与に20％が課されます。居住性の判定は現行規定をご確認ください。']]});

Object.assign(I18N.vi,{tncnSampleT:'Ví dụ mẫu (theo bài hướng dẫn)',tncnSA:'A: 25 triệu, có HĐLĐ',tncnSB:'B: 8 triệu, không hợp đồng',tncnSC:'C: 50 triệu, không cư trú',tncnLibT:'Tra cứu nhanh theo Luật Thuế TNCN 2025',tncnTaxT:'Các nhóm thu nhập chịu thuế (Điều 3)',tncnExemT:'Các khoản thu nhập được miễn thuế (Điều 4)',
tncnTaxL:['Thu nhập từ kinh doanh: sản xuất, kinh doanh hàng hóa, dịch vụ; hành nghề độc lập có giấy phép/chứng chỉ; đại lý, môi giới, hợp tác kinh doanh; thương mại điện tử, kinh doanh trên nền tảng số.','Thu nhập từ tiền lương, tiền công: tiền lương, tiền công, thù lao, các khoản lợi ích bằng tiền hoặc không bằng tiền, phụ cấp, trợ cấp (trừ các khoản luật loại trừ như phụ cấp độc hại, thu hút, khu vực, trợ cấp thôi việc, mất việc làm, trợ cấp BHXH…).','Thu nhập từ đầu tư vốn: lãi cho vay, lợi tức cổ phần, các hình thức đầu tư vốn khác.','Thu nhập từ chuyển nhượng vốn: phần vốn trong tổ chức kinh tế, chứng khoán, các hình thức khác.','Thu nhập từ chuyển nhượng bất động sản: quyền sử dụng đất và tài sản gắn liền với đất, quyền sở hữu hoặc sử dụng nhà ở, quyền thuê đất, thuê mặt nước.','Thu nhập từ trúng thưởng: xổ số, khuyến mại, đặt cược, trò chơi và cuộc thi có thưởng (trừ casino).','Thu nhập từ tiền bản quyền: chuyển giao, chuyển quyền sử dụng đối tượng sở hữu trí tuệ; chuyển giao công nghệ.','Thu nhập từ nhượng quyền thương mại.','Thu nhập từ nhận thừa kế, quà tặng là chứng khoán, phần vốn, bất động sản và tài sản phải đăng ký sở hữu hoặc sử dụng.','Thu nhập khác: chuyển nhượng tên miền “.vn”, kết quả giảm phát thải khí nhà kính và tín chỉ các-bon, biển số xe trúng đấu giá, tài sản số, vàng miếng.'],
tncnExemL:['Chuyển nhượng, thừa kế, quà tặng bất động sản giữa người thân (vợ chồng, cha mẹ và con, ông bà và cháu, anh chị em ruột…).','Chuyển nhượng nhà ở, đất ở khi cá nhân chỉ có một nhà ở, đất ở duy nhất tại Việt Nam.','Giá trị quyền sử dụng đất của cá nhân được Nhà nước giao đất.','Thu nhập của hộ gia đình, cá nhân trực tiếp sản xuất nông, lâm, thủy sản chưa qua chế biến hoặc chỉ sơ chế thông thường; sản xuất muối; lợi tức cổ phần của thành viên hợp tác xã nông nghiệp…','Thu nhập từ chuyển đổi đất nông nghiệp được Nhà nước giao để sản xuất.','Lãi trái phiếu chính phủ, trái phiếu chính quyền địa phương, lãi tiền gửi tại tổ chức tín dụng, lãi từ hợp đồng bảo hiểm nhân thọ.','Thu nhập từ kiều hối.','Tiền lương làm việc ban đêm, làm thêm giờ, tiền lương trả cho những ngày không nghỉ phép theo quy định (phần chênh lệch cao hơn mức bình thường).','Lương hưu do Quỹ BHXH chi trả; thu nhập do quỹ hưu trí bổ sung, quỹ hưu trí tự nguyện chi trả.','Học bổng từ ngân sách nhà nước hoặc từ tổ chức trong, ngoài nước theo chương trình khuyến học.','Tiền bồi thường hợp đồng bảo hiểm nhân thọ, phi nhân thọ, bồi thường tai nạn lao động, bồi thường nhà nước và các khoản bồi thường khác theo pháp luật.','Thu nhập nhận từ tổ chức, quỹ từ thiện được cơ quan có thẩm quyền cho phép, hoạt động vì mục đích từ thiện, nhân đạo, phi lợi nhuận.','Thu nhập từ nguồn viện trợ nước ngoài vì mục đích từ thiện, nhân đạo được cơ quan có thẩm quyền phê duyệt.','Tiền lương, tiền công của thuyền viên người Việt Nam làm cho hãng tàu nước ngoài hoặc hãng tàu Việt Nam vận tải quốc tế.','Thu nhập của chủ tàu, người có quyền sử dụng tàu và người làm việc trên tàu từ hoạt động phục vụ trực tiếp khai thác, đánh bắt thủy sản xa bờ.','Chuyển nhượng lần đầu kết quả giảm phát thải, tín chỉ các-bon; lãi trái phiếu xanh; chuyển nhượng lần đầu trái phiếu xanh sau khi phát hành.','Tiền lương, tiền công từ thực hiện nhiệm vụ khoa học, công nghệ và đổi mới sáng tạo.','Thu nhập từ quyền tác giả của nhiệm vụ khoa học, công nghệ và đổi mới sáng tạo khi kết quả được thương mại hóa.','Thu nhập của nhà đầu tư cá nhân, chuyên gia từ dự án khởi nghiệp sáng tạo; sáng lập viên doanh nghiệp khởi nghiệp sáng tạo; nhà đầu tư góp vốn vào quỹ đầu tư mạo hiểm.','Tiền lương, tiền công của chuyên gia nước ngoài trong chương trình, dự án ODA không hoàn lại hoặc phi chính phủ nước ngoài; người Việt làm tại cơ quan đại diện tổ chức của Liên hợp quốc; lực lượng gìn giữ hòa bình Liên hợp quốc.','Thu nhập sau khi đã nộp thuế TNDN của chủ doanh nghiệp tư nhân, chủ công ty TNHH một thành viên là cá nhân.']});

var lang='vi';

/* ---------- i18n helpers ---------- */
function t(k,p){
  var d=I18N[lang], s=d[k]!=null?d[k]:I18N.vi[k];
  if(typeof s!=='string') return s;
  return s.replace(/\{(\w+)\}/g,function(m,n){
    if(p && p[n]!=null) return p[n];
    if(n==='cur') return d.cur;
    if(n==='y') return MAX_YEAR;
    return m;
  });
}
function months(n){
  if(lang==='vi') return n+' tháng';
  if(lang==='en') return n===1?'1 month':n+' months';
  if(lang==='ja') return n+'か月';
  return n+'个月';
}
function duration(m){
  var y=Math.floor(m/12), r=m%12, s='';

var LOC={vi:{loc:'vi-VN',tz:'Asia/Ho_Chi_Minh'}, en:{loc:'en-GB',tz:'Europe/London'}, ja:{loc:'ja-JP',tz:'Asia/Tokyo'}, zh:{loc:'zh-CN',tz:'Asia/Shanghai'}};
var fmtCache={};
function getFmt(l){
  if(!fmtCache[l]){
    fmtCache[l]=new Intl.DateTimeFormat(LOC[l].loc,{timeZone:LOC[l].tz, weekday:'long', year:'numeric', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23', timeZoneName:'short'});
  }
  return fmtCache[l];
}
function tick(){
  var d=new Date(), P={};
  try{
    getFmt(lang).formatToParts(d).forEach(function(p){ P[p.type]=p.value; });
  }catch(e){
    P={weekday:'', year:d.getFullYear(), month:d.getMonth()+1, day:d.getDate(), hour:pad2(d.getHours()), minute:pad2(d.getMinutes()), second:pad2(d.getSeconds()), timeZoneName:''};
  }
  var wd=P.weekday||'', y=P.year, m=+P.month, dd=+P.day, ds;
  if(lang==='vi') ds=wd+', ngày '+dd+' tháng '+m+' năm '+y;
  else if(lang==='en') ds=wd+', '+dd+' '+MON_EN[m-1]+' '+y;
  else if(lang==='ja') ds=y+'年'+m+'月'+dd+'日（'+wd+'）';
  else ds=y+'年'+m+'月'+dd+'日 '+wd;
  $('#clkDate').textContent=ds;
  $('#clkTime').textContent=P.hour+':'+P.minute+':'+P.second;
  $('#clkZone').textContent=t('clockName')+(P.timeZoneName?' ('+P.timeZoneName+')':'');
}
setInterval(tick,1000);

function renderInfo(){
  var L=I18N[lang];
  var coef='<div><span>'+L.coefBefore+'</span><b>5.81</b></div>';
  for(var y=1995;y<=MAX_YEAR;y++) coef+='<div><span>'+y+'</span><b>'+BHXH.coef(y).toFixed(2)+'</b></div>';
  var openState=$$('#info details').map(function(d){ return d.open; });
  $('#info').innerHTML=
    '<h2 id="infoTitle">'+L.infoTitle+'</h2>'+
    '<details><summary>'+L.i1s+'</summary><div><p>'+L.i1p+'</p><ul>'+L.i1l.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul><p style="margin-top:10px">'+L.i1e+'</p></div></details>'+
    '<details><summary>'+t('i2s')+'</summary><div><p>'+L.i2p+'</p><div class="coef">'+coef+'</div></div></details>'+
    '<details><summary>'+L.i3s+'</summary><div><ul>'+L.i3l.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></details>';
  $$('#info details').forEach(function(d,i){ if(openState[i]) d.open=true; });
}
function buildExplain(r, tab, mode){
  var L=[];
  function add(x,i,c){ L.push({t:x, i:i||0, c:c||''}); }
  var cf=function(c){ return String(+c.toFixed(2)); };
  var tagOf=function(type){ return type==='ts' ? ' ['+t('pillTS')+']' : (type==='bb' ? ' ['+t('tabBB')+']' : ' ['+t('tabTN')+']'); };

  add(t('ex1',{d:duration(r.M)}),0,'h');
  add(t('ex2'),0,'h');
  add(t('ex21'),0);
  add(t('exCoefNote'),1,'note');
  r.groups.forEach(function(g){
    var tag = tab==='both' ? tagOf(g.type) : (g.type==='ts' ? tagOf('ts') : '');
    add(t('exPeriod',{what:g.type==='ts'?t('whatTS'):t('whatPay'), a:tShort(g.from), b:tShort(g.to), mo:months(g.months), sal:g.type==='ts'?t('salTS'):t('salPay'), v:vcur(g.salary), tag:tag}),1);
    add(vcur(g.salary)+' x '+cf(g.coef)+' × '+g.months+' = '+vcur(g.adj),2);
  });
  add(t('exTotalPaid',{v:vcur(r.sumAdj)}),1);
  add(t('ex22',{s:group(r.sumAdj), m:r.M, avg:vcur(r.avg)}),0);

  add(t('ex3'),0,'h');
  add(t('exSplit',{pre:r.Mpre, post:r.Mpost}),1);

  if(!r.under1){
    if(r.yearsPre>0){
      add(t('exPre'),1);
      add('1.5 × '+dec(r.yearsPre,1)+' × '+group(r.avg)+' = '+vcur(r.prePart),2);
    }
    if(r.yearsPost>0){
      add(t('exPost'),1);
      add(t('exPostNote'),1,'note');
      add('2 × '+dec(r.yearsPost,1)+' × '+group(r.avg)+' = '+vcur(r.postPart),2);
    }
    if(r.yearsPre>0 && r.yearsPost>0) add(t('exTotalBen',{a:group(r.prePart), b:group(r.postPart), v:vcur(r.gross)}),1);
    if(r.leftover) add(t('exLe'),1,'note');
  } else {
    add(t('exU1'),1);
    add(t('exU1Paid',{raw:group(r.sumRaw), v:vcur(r.sumGross)}),1);
  }

  if(r.cTN>0){
    add(t('exSupH'),0,'h');
    add(t('exSupStart'),0,'note');
    var segLine=function(s){
      add(t('exSupSeg',{a:mAny(BHXH.mOf(s.from),BHXH.yOf(s.from)), b:mAny(BHXH.mOf(s.to),BHXH.yOf(s.to))}),0);
      if(s.capped) add(t('exCapped'),1);
      else if(s.base===0) add('= '+vcur(0)+(BHXH.yOf(s.from)<2018?' '+t('exBefore'):''),1);
      else {
        add('0.22 × '+vcur(s.base)+' x '+Math.round(s.rate*100)+'% x '+months(s.months),1);
        add('= '+vcur(s.amount),1);
      }
    };
    if(mode==='topcv'){
      add(t('exSupSeg',{a:mAny(1,2018), b:mAny(12,2021)}),0);
      add('= '+vcur(0),1);
      r.segs.filter(function(s){ return !s.early; }).forEach(segLine);
    } else {
      r.segs.forEach(segLine);
    }
    add(t('exSupTotal',{v:vcur(r.supportTotal)}),0,'h');
  }

  if(r.under1){
    if(r.supportTotal>0) add(t('exPaidNet',{a:group(r.sumGross), b:group(r.supportTotal), v:vcur(r.contrib)}),1);
    add(t('exCap',{avg:group(r.avg), v:vcur(r.cap)}),1);
    add(t('exFinMin',{a:group(r.contrib), b:group(r.cap), v:vcur(r.payout)}),1,'fin');
  } else if(r.supportTotal>0){
    add(t('exFin',{a:group(r.gross), b:group(r.supportTotal), v:vcur(r.payout)}),1,'fin');
  }
  return L;
}

var toastTimer;
function toast(msg){
  var el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
function copyText(text){
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    toast(ok?t('copied'):t('copyFail'));
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(t('copied')); }, fallback);
  } else fallback();
}

function computeBHTN(b){
  var per=b.periods, map={}, overlap=false, i, j;
  for(i=0;i<per.length;i++){
    var p=per[i], s=BHXH.idx(+p.fy,+p.fm), e=BHXH.idx(+p.ty,+p.tm);
    if(e<s) return {error:'range', n:i+1};
    if(!(+p.salary>0)) return {error:'salary', n:i+1};
    for(j=s;j<=e;j++){ if(map[j]!==undefined) overlap=true; map[j]=+p.salary; }
  }
  var keys=Object.keys(map).map(Number).sort(function(x,y){return x-y;});
  var months=keys.length;
  if(months<12) return {error:'short', months:months};
  var last=keys.slice(-6), sum=0;
  var lastMonths=last.map(function(k){ return {m:BHXH.mOf(k), y:BHXH.yOf(k), sal:map[k]}; });
  last.forEach(function(k){ sum+=map[k]; });
  var avg=Math.round(sum/last.length);
  var raw=Math.round(0.6*avg);
  var wage=BHTN_REGION[b.region]||BHTN_REGION.r1;
  var cap=5*wage;
  var monthly=Math.min(raw,cap);
  var benefitMonths=Math.min(12, 3+Math.floor(Math.max(0,months-36)/12));
  var total=monthly*benefitMonths;
  var reserveMonths=(months>36)?((months-36)%12):0;
  if(months>144) reserveMonths=months-144;
  return {months:months, avg:avg, raw:raw, cap:cap, wage:wage, monthly:monthly, capped:raw>cap, benefitMonths:benefitMonths, total:total, overlap:overlap, lastMonths:lastMonths, sum6:sum, region:b.region, reserveMonths:reserveMonths};
}

  var cur_=t('cur'), rows=['r1','r2','r3','r4'].map(function(r,i){

function buildExplainBhtn(r, b){
  var L=[];
  function add(x,i,c){ L.push({t:x, i:i||0, c:c||''}); }
  var cur_=t('cur');
  var regNum=(r.region||(b&&b.region)||'r1').replace('r','');
  var regName=t('bhtnLegName', {n:regNum});

  add(t('bhtnExStep1'), 0, 'h');
  add(t('bhtnExStep1Detail', {d:duration(r.months), m:r.months}), 1);

  add(t('bhtnExStep2'), 0, 'h');
  add(t('bhtnExStep2Detail'), 1);
  if(r.lastMonths && r.lastMonths.length){
    var groups=[], cg=null;
    r.lastMonths.forEach(function(lm){
      var idx=BHXH.idx(lm.y, lm.m);
      if(cg && cg.sal===lm.sal && idx===cg.to+1){
        cg.to=idx; cg.count++;
      } else {
        cg={from:idx, to:idx, sal:lm.sal, count:1};
        groups.push(cg);
      }
    });
    groups.forEach(function(g){
      var periodStr=(g.count===1)?mAny(BHXH.mOf(g.from),BHXH.yOf(g.from)):(mAny(BHXH.mOf(g.from),BHXH.yOf(g.from))+' → '+mAny(BHXH.mOf(g.to),BHXH.yOf(g.to))+' ('+months(g.count)+')');
      add('• '+periodStr+': '+group(g.sal)+' '+cur_, 2);
    });
  }
  add('• '+t('bhtnAvgFormula', {sum:group(r.sum6), avg:group(r.avg)+' '+cur_}), 1);

  add(t('bhtnExStep3'), 0, 'h');
  add(t('bhtnExStep3Raw', {avg:group(r.avg)+' '+cur_, raw:group(r.raw)+' '+cur_}), 1);
  add(t('bhtnExStep3Cap', {reg:regName, wage:group(r.wage)+' '+cur_, cap:group(r.cap)+' '+cur_}), 1, 'note');
  if(r.capped){
    add(t('bhtnExStep3CapApplied', {raw:group(r.raw)+' '+cur_, cap:group(r.cap)+' '+cur_, monthly:group(r.monthly)+' '+cur_}), 1);
  } else {
    add(t('bhtnExStep3Final', {monthly:group(r.monthly)+' '+cur_}), 1);
  }

  add(t('bhtnExStep4'), 0, 'h');
  add(t('bhtnExStep4Detail'), 1);
  add(t('bhtnExStep4Res', {m:r.months, bm:duration(r.benefitMonths)}), 1);
  if(r.reserveMonths>0){
    add(t('bhtnExStep4Reserve', {rm:r.reserveMonths}), 1, 'note');
  }

  add(t('bhtnExStep5'), 0, 'h');
  add(t('bhtnExStep5Detail', {
    monthly:group(r.monthly)+' '+cur_,
    bm:r.benefitMonths,
    total:group(r.total)+' '+cur_,
    words:readMoney(r.total)
  }), 1, 'fin');

  return L;
}

$('#page-bhtn').addEventListener('input', function(e){
  var el=e.target; if(!el.classList || !el.classList.contains('bhtnSal')) return;
  var p=findBhtnP(el.dataset.pid); if(!p) return;
  var caret=el.selectionStart==null?el.value.length:el.selectionStart;
  var digitsBefore=el.value.slice(0,caret).replace(/\D/g,'').length;
  var digits=el.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,12);
  el.value=digits?group(digits):'';
  var pos=0,c=0;
  while(pos<el.value.length && c<digitsBefore){ if(/\d/.test(el.value.charAt(pos))) c++; pos++; }
  try{ el.setSelectionRange(pos,pos); }catch(err){}
  p.salary=digits; state.bhtn.result=null; saveStore();
});
$('#page-bhtn').addEventListener('click', function(e){
  var t0=e.target;
  var del=t0.closest('.per-del');
  if(del){
    state.bhtn.periods=state.bhtn.periods.filter(function(x){ return x.id!==del.dataset.del; });
    if(!state.bhtn.periods.length) state.bhtn.periods=freshBhtn().periods;
    state.bhtn.result=null; saveStore(); renderBhtnForm(); return;
  }
  if(t0.closest('#bhtnAdd')){
    var ps=state.bhtn.periods, last=ps[ps.length-1];
    var ni=BHXH.idx(+last.ty,+last.tm)+1, sy=BHXH.yOf(ni), sm=BHXH.mOf(ni);

    var ei=Math.min(ni+11, BHXH.idx(MAX_YEAR,12)), ey=BHXH.yOf(ei), em=BHXH.mOf(ei);

    state.bhtn.result=null; saveStore(); renderBhtnForm();
    var cards=$$('.bhtn-per'); var lc=cards[cards.length-1];
    if(lc && lc.scrollIntoView) try{ lc.scrollIntoView({block:'nearest', behavior:reducedMotion()?'auto':'smooth'}); }catch(err){}

});

/* ---------- Timeline ---------- */
function rangeOk(p){ return BHXH.idx(+p.ty,+p.tm) >= BHXH.idx(+p.fy,+p.fm); }
function renderTimeline(){
  var items=state.list.filter(rangeOk), el=$('#timeline');
  if(!items.length){ el.innerHTML='<p class="tl-empty">'+t('tlEmpty')+'</p>'; return; }
  var min=Infinity, max=-Infinity;
  items.forEach(function(p){ min=Math.min(min,BHXH.idx(+p.fy,+p.fm)); max=Math.max(max,BHXH.idx(+p.ty,+p.tm)); });
  var span=max-min+1, lanes='';
  ['bb','ts','tn'].forEach(function(ty){
    var its=items.filter(function(p){ return p.type===ty; }); if(!its.length) return;
    var segs=its.map(function(p){
      var a=BHXH.idx(+p.fy,+p.fm), b=BHXH.idx(+p.ty,+p.tm);
      return '<i style="left:'+((a-min)/span*100).toFixed(2)+'%;width:'+((b-a+1)/span*100).toFixed(2)+'%;background:var(--c-'+ty+')" title="'+tShort(a)+' - '+tShort(b)+'"></i>';
    }).join('');
    lanes+='<div class="lane"><span class="ln">'+typeLabel(ty)+'</span><div class="track">'+segs+'</div></div>';
  });
  var y0=BHXH.yOf(min), y1=BHXH.yOf(max), step=(y1-y0)>30?10:((y1-y0)>14?5:((y1-y0)>7?2:1)), ticks='';
  for(var y=y0;y<=y1;y++){
    if((y-y0)%step) continue;
    var pos=(BHXH.idx(y,1)-min)/span*100; if(pos<0) pos=0;
    ticks+='<span style="left:'+pos.toFixed(2)+'%">'+y+'</span>';
  }
  el.innerHTML='<div class="tl-h"><h3>'+t('tlTitle')+'</h3><span>'+tShort(min)+' → '+tShort(max)+' ('+duration(span)+')</span></div>'+lanes+'<div class="axis">'+ticks+'</div>';
}

/* ---------- Live result ---------- */
var current=null, lastText='';
function update(){
  var list=state.list, valid=[], incomplete=0, bad={};
  list.forEach(function(p,i){
    if(!rangeOk(p)){ bad[p.id]=i+1; return; }
    if(p.type!=='ts' && !(+p.salary>0)){ incomplete++; return; }
    valid.push(p);
  });
  $$('.card').forEach(function(c){
    var id=+c.dataset.id, pl=findP(id); if(!pl) return;
    var er=c.querySelector('.card-err'), isBad=!!bad[id];
    c.classList.toggle('bad',isBad); er.hidden=!isBad;
    if(isBad) er.textContent=t('errRange',{n:bad[id]});
    var n=BHXH.idx(+pl.ty,+pl.tm)-BHXH.idx(+pl.fy,+pl.fm)+1;
    c.querySelector('.dur').innerHTML = n>0 ? ('<span class="dur-ic">'+ICON_CLOCK+'</span><span class="dur-txt"><b class="dur-lbl">'+t('durLabel')+'</b><b class="dur-val">'+duration(n)+'</b></span><span class="dur-deco">'+ICON_CAL+'</span>') : '';
    c.querySelectorAll('.chip').forEach(function(ch){ ch.classList.toggle('active', n===+ch.dataset.q); });
  });
  $('#modeBox').hidden = !list.some(function(p){ return p.type==='tn'; });
  $$('input[name="mode"]').forEach(function(r){ r.checked = r.value===state.mode; });
  renderTimeline();

  var out = valid.length ? BHXH.compute(valid, nowIdx, state.mode) : null;
  if(!out || out.errors.length){
    current=null;
    renderReceipt(null, out?out.errors:[], incomplete);
  } else {
    var kinds={}; valid.forEach(function(p){ kinds[p.type]=1; });
    current={r:out.result, warnings:out.warnings, mode:out.mode, tab:Object.keys(kinds).length>1?'both':'bb'};
    renderReceipt(current, [], incomplete);
  }
  renderDetail();
}

  if(s.i<s.text.length) s.timer=setTimeout(aiStream,16); else aiState.typing=null;
}
function currentAiSet(){ return (state.app==='bhtn') ? {q:I18N[lang].bhtnAiQ, k:I18N[lang].bhtnAiK} : {q:I18N[lang].aiQ, k:I18N[lang].aiK}; }
function aiAsk(i){
  var set0=currentAiSet(), qs=set0.q, ks=set0.k;
  if(!qs || i<0 || i>=qs.length) return;
  aiFinish();
  aiState.userCount++;
  aiState.asked[i]=true;
  $('#aiMsgs').insertAdjacentHTML('beforeend','<div class="msg user"><div class="bub">'+fmtMsg(qs[i])+'</div></div>');
  var id='aib'+(++aiState.lastId);
  $('#aiMsgs').insertAdjacentHTML('beforeend', aiBotBubble(id));
  $('#'+id).innerHTML='<span class="dots" role="status" aria-label="'+t('aiTyping')+'"><i></i><i></i><i></i></span>';
  aiScroll(); aiMarkAsked();
  var ans=aiAnswer(ks[i]), cjk=/[\u3040-\u30ff\u4e00-\u9fff]/.test(ans);
  var delay=reducedMotion()?0:420+Math.min(600,ans.length*3);
  aiState.typing={id:id, text:ans, i:0, step:reducedMotion()?ans.length:(cjk?2:3), timer:setTimeout(aiStream,delay)};
}
function aiWelcome(){
  aiFinish();
  aiState.userCount=0; aiState.asked={};
  $('#aiMsgs').innerHTML=aiBotBubble('aiw')+'';
  $('#aiw').innerHTML=fmtMsg(state.app==='bhtn' ? t('bhtnAiWelcome') : t('aiWelcome'));
  aiMarkAsked();
}
function aiLang(){
  $('#aiClose').setAttribute('aria-label', t('aiClose'));
  $('#aiClose').setAttribute('title', t('aiClose'));
  $('#aiNew').setAttribute('aria-label', t('aiClear'));
  $('#aiNew').setAttribute('title', t('aiClear'));
  $('#aiChips').innerHTML=(currentAiSet().q||[]).map(function(c,i){ return '<button type="button" class="qbtn" data-chip="'+i+'"><span class="qn">'+(i+1)+'</span><span class="qt">'+esc(c)+'</span></button>'; }).join('');
  aiMarkAsked();
  if(aiState.userCount===0) aiWelcome();
}
function aiOpen(open){
  $('#aiPanel').hidden=!open;
  $('#aiFab').setAttribute('aria-expanded', String(open));
  if(open){ setTimeout(function(){ try{ var b=document.querySelector('.qbtn'); if(b) b.focus(); }catch(e){} },50); aiScroll(); }
  else { try{ $('#aiFab').focus(); }catch(e){} }
}
function aiMarkAsked(){
  $$('.qbtn').forEach(function(b){ b.classList.toggle('done', !!aiState.asked[+b.dataset.chip]); });
}
$('#aiFab').addEventListener('click', function(){ aiOpen($('#aiPanel').hidden); });
$('#aiClose').addEventListener('click', function(){ aiOpen(false); });
$('#aiNew').addEventListener('click', function(){ aiWelcome(); });
$('#aiPanel').addEventListener('keydown', function(e){ if(e.key==='Escape') aiOpen(false); });
$('#aiChips').addEventListener('click', function(e){
  var b=e.target.closest('[data-chip]'); if(!b) return;
  aiAsk(+b.dataset.chip);
});
function syncFab(){
  var m=$('#mbar'), vis=!m.classList.contains('off') && !m.classList.contains('nores');
  $('#aiFab').classList.toggle('up', vis);
}

/* ---------- Personal income tax (TNCN) ---------- */
/* Luật Thuế TNCN 2025 Đ.9: 5/10/20/30/35%, mốc tháng 10/30/60/100 triệu */
var TX_B=[[10e6,.05],[30e6,.10],[60e6,.20],[100e6,.30],[Infinity,.35]];
var TX={type:'res',gross:'',ins:'',dep:0,other:''};
function txNum(v){ return parseInt(String(v).replace(/\D/g,''),10)||0; }
function txCalc(){
  var g=txNum(TX.gross); if(!g) return null;
  if(TX.type==='nocontract'){ var t2=g>=5000000?g*0.10:0; return {kind:2,g:g,tax:t2,net:g-t2,eff:t2/g,low:g<5000000}; }
  if(TX.type==='nonres'){ var t3=g*0.20; return {kind:3,g:g,tax:t3,net:g-t3,eff:0.20}; }
  var insBase=TX.ins===''?g:txNum(TX.ins), ins=Math.round(insBase*0.105);
  var self=15500000, dep=TX.dep*6200000, oth=txNum(TX.other);
  var taxable=Math.max(0,g-ins-self-dep-oth), tax=0, prev=0, rows=[];
  TX_B.forEach(function(b,i){
    var span=Math.min(taxable,b[0])-prev;
    if(span>0){ var x=span*b[1]; tax+=x; rows.push({i:i+1,rate:b[1],base:span,tax:x}); }
    prev=b[0];
  });
  return {kind:1,g:g,ins:ins,self:self,dep:dep,oth:oth,taxable:taxable,tax:tax,net:g-ins-tax,rows:rows,eff:tax/g};
}
function renderTncn(){
  var types=[['res','tncnT1','5–35%'],['nocontract','tncnT2','10%'],['nonres','tncnT3','20%']];
  var seg=types.map(function(o){ return '<button type="button" class="tx-opt" data-tx-type="'+o[0]+'" aria-pressed="'+(TX.type===o[0])+'"><span class="bd">'+o[2]+'</span><span>'+t(o[1])+'</span></button>'; }).join('');
  var chips=[10,20,30,50,100].map(function(m){ return '<button type="button" class="tx-chip" data-tx-g="'+(m*1e6)+'">'+m+'M</button>'; }).join('');
  var full=TX.type==='res';
  $('#page-tncn').innerHTML=
    '<div class="tx-wrap"><section class="panel"><h2><span class="stepno">1</span>'+t('tncnTitle')+'</h2>'+
    '<div class="tx-sample"><span class="lbl">'+t('tncnSampleT')+'</span><div class="tx-chips"><button type="button" class="tx-chip" data-tx-s="A">'+t('tncnSA')+'</button><button type="button" class="tx-chip" data-tx-s="B">'+t('tncnSB')+'</button><button type="button" class="tx-chip" data-tx-s="C">'+t('tncnSC')+'</button></div></div>'+
    '<div class="tx-f"><span class="lbl">'+t('tncnType')+'</span><div class="tx-seg">'+seg+'</div></div>'+
    '<div class="tx-f"><span class="lbl">'+t('tncnGross')+'</span><div class="tx-inwrap"><input class="tx-in" id="txGross" inputmode="numeric" autocomplete="off" placeholder="25,000,000" value="'+(TX.gross?group(txNum(TX.gross)):'')+'"></div><div class="tx-chips">'+chips+'</div></div>'+
    (full?
    '<div class="tx-f"><span class="lbl">'+t('tncnDep')+'</span><div class="tx-step"><button type="button" data-tx-dep="-1" aria-label="−">−</button><span id="txDepN">'+TX.dep+'</span><button type="button" data-tx-dep="1" aria-label="+">+</button></div></div>'+
    '<div class="tx-f"><span class="lbl">'+t('tncnIns')+'</span><input class="tx-in" id="txIns" inputmode="numeric" autocomplete="off" value="'+(TX.ins===''?'':group(txNum(TX.ins)))+'"><span class="tx-h">'+t('tncnInsHint')+'</span></div>'+
    '<div class="tx-f"><span class="lbl">'+t('tncnOther')+'</span><input class="tx-in" id="txOther" inputmode="numeric" autocomplete="off" value="'+(TX.other?group(txNum(TX.other)):'')+'"></div>':'')+
    '</section><section class="panel" id="txRes" aria-live="polite"></section></div>'+txLib();
  updateTncn();
}
function updateTncn(){
  var box=$('#txRes'); if(!box) return;
  var r=txCalc(), c=t('cur');
  if(!r){ box.innerHTML='<p style="margin:0;color:var(--muted)">'+t('tncnEmpty')+'</p><p class="tx-note">'+t('tncnNote')+'</p>'; return; }
  function row(k,v,neg){ return '<div class="tx-row'+(neg?' neg':'')+'"><span>'+t(k)+'</span><b>'+(neg?'− ':'')+group(v)+' '+c+'</b></div>'; }
  var pc=function(x){ return Math.max(0,x/r.g*100); }, insV=r.ins||0;
  var head='<div class="tx-hero"><div class="k">'+t('tncnNet')+'</div><div class="v">'+group(r.net)+' '+c+'</div><div class="s">'+t('tncnIncome')+': '+group(r.g)+' '+c+'</div></div>'+
    '<div><div class="tx-bar"><i style="width:'+pc(r.net)+'%;background:var(--c-tn)"></i><i style="width:'+pc(insV)+'%;background:var(--c-ts)"></i><i style="width:'+pc(r.tax)+'%;background:var(--c-bb)"></i></div>'+
    '<div class="tx-lg" style="margin-top:10px"><span><i style="background:var(--c-tn)"></i>'+t('tncnNet')+' '+dec(pc(r.net),1)+'%</span>'+(insV?'<span><i style="background:var(--c-ts)"></i>'+t('tncnInsRow')+' '+dec(pc(insV),1)+'%</span>':'')+'<span><i style="background:var(--c-bb)"></i>'+t('tncnTax')+' '+dec(pc(r.tax),1)+'%</span></div></div>';
  var eff='<div class="tx-row"><span>'+t('tncnEff')+'</span><b>'+dec(r.eff*100,2)+'%</b></div>';
  var yr='<p class="tx-h" style="margin-top:12px">'+t('tncnYear',{tax:group(r.tax*12),net:group(r.net*12),c:c})+'</p>';
  var note='<p class="tx-note">'+t('tncnNote')+'</p>';
  if(r.kind!==1){
    box.innerHTML=head+row('tncnIncome',r.g)+row('tncnTax',r.tax,1)+eff+'<p class="tx-h" style="margin-top:12px">'+t(r.kind===2?'tncnF2':'tncnF3')+'</p>'+(r.low?'<p class="tx-note">'+t('tncnLow')+'</p>':'')+txSteps(r)+txGloss()+note;
    return;
  }
  var tb=r.rows.map(function(x){ return '<tr><td>'+x.i+'</td><td>'+group(x.base)+'</td><td>'+Math.round(x.rate*100)+'%</td><td>'+group(x.tax)+'</td></tr>'; }).join('');
  box.innerHTML=head+
    row('tncnIncome',r.g)+row('tncnInsRow',r.ins,1)+row('tncnSelf',r.self,1)+(r.dep?row('tncnDepRow',r.dep,1):'')+(r.oth?row('tncnOtherRow',r.oth,1):'')+
    row('tncnTaxable',r.taxable)+row('tncnTax',r.tax,1)+eff+
    (tb?'<div class="tx-sc"><span class="lbl">'+t('tncnBr')+'</span><table class="tx-t"><thead><tr><th>'+t('tncnLvl')+'</th><th>'+t('tncnBase')+'</th><th>'+t('tncnRate')+'</th><th>'+t('tncnTaxCol')+'</th></tr></thead><tbody>'+tb+'</tbody></table></div>':'')+yr+txSteps(r)+txRef(r)+txGloss()+note;
}

function txSteps(r){
  var c=t('cur'), g=group, L=[];
  function li(h,sub){ return '<li><div>'+h+'</div>'+(sub?'<small>'+sub+'</small>':'')+'</li>'; }
  L.push(li(t('tncnS1',{g:g(r.g),c:c}),t('tncnL1')));
  if(r.kind===1){
    var insBase=TX.ins===''?r.g:txNum(TX.ins);
    L.push(li(t('tncnS2',{b:g(insBase),i:g(r.ins),c:c}),t('tncnL2')));
    L.push(li(t('tncnS3',{n:String(TX.dep),d:g(r.self+r.dep),c:c})+(r.oth?' '+t('tncnS3o',{o:g(r.oth),c:c}):''),t('tncnL3')));
    var raw=r.g-r.ins-r.self-r.dep-r.oth;
    L.push(li(t('tncnS4',{g:g(r.g),i:g(r.ins),d:g(r.self+r.dep),o:(r.oth?' − '+g(r.oth):''),x:g(r.taxable),c:c})+(raw<=0?' '+t('tncnS4z'):''),t('tncnL4')));
    var bl=r.rows.map(function(x){ return '<div>'+t('tncnBL',{n:String(x.i),b:g(x.base),r:String(Math.round(x.rate*100)),t:g(x.tax),c:c})+'</div>'; }).join('');
    L.push(li(t('tncnS5')+(bl?bl+'<div><b>'+t('tncnSum',{t:g(r.tax),c:c})+'</b></div>':''),t('tncnL5')));
    L.push(li(t('tncnNetF1',{g:g(r.g),i:g(r.ins),t:g(r.tax),n:g(r.net),c:c}),t('tncnL6')));
  } else {
    L.push(li(r.low?t('tncnXlow',{c:c}):t('tncnX',{g:g(r.g),r:r.kind===2?'10':'20',t:g(r.tax),c:c}),t(r.kind===2?'tncnL7':'tncnL8')));
    L.push(li(t('tncnNetF2',{g:g(r.g),t:g(r.tax),n:g(r.net),c:c})));
  }
  return '<div class="tx-sec"><h3>'+t('tncnExT')+'</h3><ol class="tx-steps">'+L.join('')+'</ol></div>';
}
function txRef(r){
  var mo=[10,30,60,100], hit={}; r.rows.forEach(function(x){ hit[x.i]=1; });
  var rt=[5,10,20,30,35];
  function rng(a,b,k){ return a==null ? t('tncnUpTo',{a:g2(b*k)}) : (b==null ? t('tncnOver',{a:g2(a*k)}) : t('tncnFromTo',{a:g2(a*k),b:g2(b*k)})); }
  function g2(n){ return group(n); }
  var rows=rt.map(function(x,i){
    var a=i?mo[i-1]:null, b=i<4?mo[i]:null;
    return '<tr'+(hit[i+1]?' class="hit"':'')+'><td>'+(i+1)+'</td><td>'+rng(a,b,12)+'</td><td>'+rng(a,b,1)+'</td><td>'+x+'%</td></tr>';
  }).join('');
  return '<div class="tx-sec"><h3>'+t('tncnRefT')+' <small style="font-weight:400;color:var(--muted)">('+t('tncnUnit')+')</small></h3><div class="tx-sc" style="margin-top:0"><table class="tx-t"><thead><tr><th>'+t('tncnLvl')+'</th><th>'+t('tncnYearC')+'</th><th>'+t('tncnMonthC')+'</th><th>'+t('tncnRate')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function txLib(){
  function box(title,arr){ return '<details class="tx-gl"><summary><span class="n">'+arr.length+'</span>'+title+'</summary><ol>'+arr.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ol></details>'; }
  return '<section class="panel tx-lib"><h2 style="margin:0 0 6px"><span class="stepno">2</span>'+t('tncnLibT')+'</h2>'+box(t('tncnTaxT'),t('tncnTaxL'))+box(t('tncnExemT'),t('tncnExemL'))+'</section>';
}
function txGloss(){
  return '<div class="tx-sec"><h3>'+t('tncnGlT')+'</h3>'+t('tncnGl').map(function(x){ return '<details class="tx-gl"><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'; }).join('')+'</div>';
}
function txMoneyInput(e){
  var el=e.target, n=txNum(el.value); el.value=n?group(n):'';
  if(el.id==='txGross') TX.gross=el.value; else if(el.id==='txIns') TX.ins=el.value; else TX.other=el.value;
  updateTncn();
}
$('#page-tncn').addEventListener('input', function(e){ if(e.target.matches('.tx-in')) txMoneyInput(e); });
$('#page-tncn').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.txS){ var S={A:['res','25000000'],B:['nocontract','8000000'],C:['nonres','50000000']}[b.dataset.txS]; TX.type=S[0]; TX.gross=S[1]; TX.dep=0; TX.ins=''; TX.other=''; renderTncn(); }
  else if(b.dataset.txType){ TX.type=b.dataset.txType; renderTncn(); }
  else if(b.dataset.txG){ TX.gross=b.dataset.txG; var el=$('#txGross'); if(el) el.value=group(+b.dataset.txG); updateTncn(); }
  else if(b.dataset.txDep){ TX.dep=Math.min(10,Math.max(0,TX.dep+(+b.dataset.txDep))); $('#txDepN').textContent=TX.dep; updateTncn(); }
});
$('#page-tncn').addEventListener('change', function(e){
  if(e.target.id==='txDep'){ TX.dep=+e.target.value; updateTncn(); }
  else if(e.target.id==='txType'){ TX.type=e.target.value; renderTncn(); }
});

applyLang();
renderCards();
update();
syncFab();
$$('.apptab').forEach(function(x){ x.setAttribute('aria-selected', String(x.dataset.app===state.app)); });
$('#page-bhxh').hidden = state.app!=='bhxh';
$('#page-bhtn').hidden = state.app!=='bhtn';
setHeroMode(state.app);
if(state.app==='bhtn') renderBhtnForm();
})();
